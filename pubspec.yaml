name: jetalpur_dham
description: "Official app of Shree Swaminarayan Temple, Jetalpur Dham"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  flutter_local_notifications: ^22.3.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  # Restores the plain player when background audio cannot start
  # (kirtan_audio_init.dart).
  just_audio_platform_interface: ^4.6.0
  audio_session: ^0.2.4
  dio: ^5.11.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.4
  photo_view: ^0.15.0
  gal: ^2.3.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  google_maps_flutter: ^2.18.2
  panorama_viewer: ^2.0.7
  pdfrx: ^2.6.5
  # 7.3.2 needs dbus ^0.8 which conflicts with flutter_local_notifications 22.
  connectivity_plus: ">=7.3.1 <7.3.2"
  package_info_plus: ^10.2.2
  shimmer: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  audio_video_progress_bar: ^2.0.3
  rxdart: ^0.28.0
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  flutter_cache_manager: ^3.4.5
  wakelock_plus: ^1.8.0
  cached_network_image_platform_interface: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.3.0
  google_maps_flutter_platform_interface: ^2.17.0

# The demo build runs fake_cloud_firestore in release mode; see
# third_party/fake_cloud_firestore/PATCHED.md.
dependency_overrides:
  fake_cloud_firestore:
    path: third_party/fake_cloud_firestore

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/LICENSE-OFL.txt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: HindVadodara
      fonts:
        - asset: assets/fonts/HindVadodara-Regular.ttf
        - asset: assets/fonts/HindVadodara-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindVadodara-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindVadodara-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700

# Launcher icon: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#C2410C"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  min_sdk_android: 24

# Native splash: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFF8F0"
  image: assets/icons/splash_logo.png
  color_dark: "#17120E"
  image_dark: assets/icons/splash_logo.png
  android_12:
    color: "#FFF8F0"
    image: assets/icons/splash_logo.png
    color_dark: "#17120E"
    image_dark: assets/icons/splash_logo.png
  fullscreen: false
